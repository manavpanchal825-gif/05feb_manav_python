<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connected Planet Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a2450 0%, #0b1020 45%, #05070f 100%);
      overflow: hidden;
      color: white;
    }

    #app {
      position: relative;
      width: 800px;
      height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .planet-center {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd36b, #ff9f43, #ff6b00);
      box-shadow: 0 0 30px rgba(255, 166, 0, 0.5), 0 0 100px rgba(255, 140, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 5;
      text-align: center;
      padding: 20px;
    }

    .planet-center h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .planet-center p {
      font-size: 14px;
      opacity: 0.9;
    }

    .orbit-ring {
      position: absolute;
      width: 450px;
      height: 450px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
    }

    .planet-menu {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .planet {
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 0 15px rgba(255,255,255,0.15);
      transition: transform 0.3s, box-shadow 0.3s, border 0.3s;
    }

    .planet:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255,255,255,0.35);
    }

    .planet.active {
      border: 3px solid white;
      transform: scale(1.12);
      box-shadow: 0 0 30px rgba(255,255,255,0.45);
    }

    .mercury { background: #8c7f74; top: 90px; left: 360px; }
    .venus   { background: #c98d47; top: 150px; right: 150px; }
    .earth   { background: #2e86de; top: 310px; right: 70px; }
    .mars    { background: #b33939; bottom: 190px; right: 110px; }
    .jupiter { background: #c27c48; bottom: 80px; right: 250px; }
    .saturn  { background: #d2b46d; bottom: 80px; left: 250px; }
    .uranus  { background: #5dade2; bottom: 190px; left: 110px; }
    .neptune { background: #3867d6; top: 310px; left: 70px; }

    svg.lines {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .line {
      stroke: rgba(255,255,255,0.25);
      stroke-width: 2;
    }

    .line.active {
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 6px white);
    }

    @media (max-width: 900px) {
      #app {
        width: 95vw;
        height: 95vw;
      }

      .planet {
        width: 70px;
        height: 70px;
        font-size: 10px;
      }

      .planet-center {
        width: 130px;
        height: 130px;
      }

      .planet-center h2 {
        font-size: 18px;
      }

      .planet-center p {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <svg class="lines" viewBox="0 0 800 800">
      <line id="line-mercury" class="line" x1="400" y1="400" x2="407" y2="137"></line>
      <line id="line-venus"   class="line" x1="400" y1="400" x2="602" y2="197"></line>
      <line id="line-earth"   class="line" x1="400" y1="400" x2="682" y2="357"></line>
      <line id="line-mars"    class="line" x1="400" y1="400" x2="642" y2="562"></line>
      <line id="line-jupiter" class="line" x1="400" y1="400" x2="547" y2="672"></line>
      <line id="line-saturn"  class="line" x1="400" y1="400" x2="297" y2="672"></line>
      <line id="line-uranus"  class="line" x1="400" y1="400" x2="157" y2="562"></line>
      <line id="line-neptune" class="line" x1="400" y1="400" x2="117" y2="357"></line>
    </svg>

    <div class="orbit-ring"></div>

    <div class="planet-center" id="planetInfo">
      <h2>Mercury</h2>
      <p>Closest planet to the Sun</p>
    </div>

    <div class="planet-menu">
      <button class="planet mercury active" data-name="Mercury" data-info="Closest planet to the Sun">Mercury</button>
      <button class="planet venus" data-name="Venus" data-info="Hottest planet in the Solar System">Venus</button>
      <button class="planet earth" data-name="Earth" data-info="Our home planet">Earth</button>
      <button class="planet mars" data-name="Mars" data-info="Known as the Red Planet">Mars</button>
      <button class="planet jupiter" data-name="Jupiter" data-info="Largest planet">Jupiter</button>
      <button class="planet saturn" data-name="Saturn" data-info="Famous for its rings">Saturn</button>
      <button class="planet uranus" data-name="Uranus" data-info="An ice giant planet">Uranus</button>
      <button class="planet neptune" data-name="Neptune" data-info="Farthest known major planet">Neptune</button>
    </div>
  </div>

  <script>
    const planets = document.querySelectorAll('.planet');
    const infoBox = document.getElementById('planetInfo');

    function removeActive() {
      planets.forEach(planet => planet.classList.remove('active'));
      document.querySelectorAll('.line').forEach(line => line.classList.remove('active'));
    }

    planets.forEach(planet => {
      planet.addEventListener('click', () => {
        removeActive();

        planet.classList.add('active');

        const name = planet.dataset.name;
        const info = planet.dataset.info;

        infoBox.innerHTML = `<h2>${name}</h2><p>${info}</p>`;

        const className = [...planet.classList].find(c =>
          ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'].includes(c)
        );

        const activeLine = document.getElementById(`line-${className}`);
        if (activeLine) {
          activeLine.classList.add('active');
        }
      });
    });

    document.getElementById('line-mercury').classList.add('active');
  </script>

</body>
</html>
