<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planet Picker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div class="planet-container">
    <img id="planetImg" src="">
    <h1 id="planetName"></h1>
    <p id="planetDesc"></p>
  </div>

  <!-- Clickable Buttons -->
  <div class="planet-buttons">
    <span data-index="0">Mercury</span>
    <span data-index="1">Venus</span>
    <span data-index="2">Earth</span>
    <span data-index="3">Mars</span>
    <span data-index="4">Jupiter</span>
    <span data-index="5">Saturn</span>
    <span data-index="6">Uranus</span>
    <span data-index="7">Neptune</span>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
